server:
  http_listen_port: 9080   # метрики Promtail
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml  # хранение оффсетов

clients:
  - url: http://localhost:3100/loki/api/v1/push   # адрес Loki

scrape_configs:
  - job_name: go-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: go-backend
          app: my-service
          __path__: /var/lib/docker/containers/*/*log

pipeline_stages:
  - json:
      expressions:
        level: level
        msg: message
        ts: time
  - labels:
      level:
  - output:
      source: msg
  - timestamp:
      source: ts
      format: RFC3339
