server:
  http_listen_port: 9080   # метрики Promtail
  grpc_listen_port: 0
#  log_level: debug

positions:
  filename: /tmp/positions.yaml  # хранение оффсетов

clients:
  - url: http://loki:3100/loki/api/v1/push   # адрес Loki

scrape_configs:
  - job_name: go-backend-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
            - name: name
              values: [ 'backend' ]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'

    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            ts: ts
            caller: caller
      - labels:
          level:
      - timestamp:
          source: ts
          format: RFC3339
